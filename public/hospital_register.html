<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hospital Registration - MediChain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1d3557, #457b9d);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  .container {
    background: rgba(255, 255, 255, 0.98);
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-weight: 700;
    text-align: center;
    color: #19334f;
    margin-bottom: 35px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #405c77;
  }
  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 22px;
    border: 2px solid #bccad6;
    border-radius: 14px;
    font-size: 1rem;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }
  input:focus {
    border-color: #457b9d;
    outline: none;
    box-shadow: 0 0 8px rgba(69, 123, 157, 0.3);
  }
  button {
    width: 100%;
    background: linear-gradient(135deg, #1d3557, #457b9d);
    border: none;
    border-radius: 16px;
    padding: 16px 0;
    color: white;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
  }
  .login-link {
    display: block;
    color: #1d3557;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
    text-align: center;
  }
    #message {
        margin-bottom: 1em;
        padding: 1em;
        border-radius: 8px;
        display: none;
        text-align: center;
        font-weight: 600;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
</style>
</head>
<body>
  <div class="container">
    <h1>Hospital Registration</h1>
    <form id="register-form">
      <div id="message"></div>
      <label for="hospital_name">Hospital Name</label>
      <input type="text" id="hospital_name" name="hospital_name" required placeholder="e.g., KIMS Hospital"/>

      <label for="email">Official Email Address</label>
      <input type="email" id="email" name="email" required placeholder="contact@hospital.com"/>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Choose a secure password"/>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="e.g., 08012345678" />

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required placeholder="Street, City, State"/>

      <label for="num_beds">Number of Beds</label>
      <input type="number" id="num_beds" name="num_beds" required placeholder="e.g., 200"/>

      <label for="specialties">Specialties (comma-separated)</label>
      <input type="text" id="specialties" name="specialties" required placeholder="Cardiology, Neurology"/>

      <button type="submit">Register Hospital</button>
    </form>
    <a href="/hospital_login.html" class="login-link">Already registered? Log In</a>
  </div>
<script>
    document.getElementById('register-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const msgDiv = document.getElementById('message');
        msgDiv.style.display = 'none';
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/hospital/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Registration failed');
            msgDiv.textContent = result.message;
            msgDiv.className = 'success';
            setTimeout(() => { window.location.href = '/hospital_login.html'; }, 2000);
        } catch (error) {
            msgDiv.textContent = 'Error: ' + error.message;
            msgDiv.className = 'error';
        }
        msgDiv.style.display = 'block';
    });
</script>
</body>
</html>
